[project]
name = "tritokti"
version = "0.1.0"
description = "Triton-to-KTIR kernel porting for vLLM on IBM Spyre"
readme = "experiment-design.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "torch>=2.4.0",
    "triton>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kernels", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
