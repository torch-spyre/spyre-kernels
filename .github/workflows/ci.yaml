# Per-PR CI. Two checks run in parallel on different nodes:
#
#   gpu-td-tests   (GPU node)  — T0: tensor-descriptor kernels vs the
#                                vLLM-derived / PyTorch reference (tests/triton/).
#   cpu-ktir-tests (CPU node)  — T2: KTIR regenerated from kernel source, then
#                                validated on the ktir-cpu simulator
#                                (tests/ktir/, ktir_cpu-marked subset).
#
# The CPU job does NOT trust the committed .ktir: it regenerates every variant
# with scripts/gen_ktir.py before testing, so the simulator always validates
# KTIR freshly lowered from the current kernel source. That lowering needs the
# spyre-enabled Triton build, layered in per-run with `uv run --with`.

name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # spyre-enabled Triton build used to lower kernels to KTIR. Pinned to the
  # sha the committed *.ktir were generated with (README pin); @main currently
  # breaks the make_tensor_descriptor lowering path (_unflatten_ir on None).
  SPYRE_TRITON: "triton @ git+https://github.com/torch-spyre/triton@5b467467c883c53ec7a8a89f9e89cfd55241034b"

jobs:
# GPU tests - uncomment when we have a GPU worker available
#  gpu-td-tests:
#    name: GPU — TD kernels vs reference (T0)
#    runs-on: [linux, x86_64, gpu]
#    timeout-minutes: 120
#    steps:
#      - uses: actions/checkout@v7
#
#      - name: Install uv
#        uses: astral-sh/setup-uv@v7
#
#      - name: Install deps
#        run: uv sync --extra test
#
#      - name: Run tensor-descriptor equivalence tests
#        run: uv run pytest tests/triton/ -v

  cpu-ktir-tests:
    name: CPU — ktir-cpu validator (T2)
    runs-on: [linux, x86_64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install deps
        run: uv sync --extra test

      # The setup_mlir.py downloads a prebuilt LLVM/MLIR
      # artifact from torch-spyre/ktir-mlir-frontend and needs a token for that fetch.
      - name: Regenerate KTIR from source
        env:
          GIT_PAT: ${{ secrets.GITHUB_TOKEN }}
          # Cap build parallelism: the spyre Triton source build defaults to
          # -j(2 * nproc), and on the self-hosted runner that peaks RAM during
          # the LLVM link and OOM-kills the runner agent ("lost communication
          # with the server"). MAX_JOBS bounds compile jobs;
          # TRITON_PARALLEL_LINK_JOBS bounds the RAM-heavy link step.
          MAX_JOBS: "4"
          TRITON_PARALLEL_LINK_JOBS: "1"
        run: uv run --with "$SPYRE_TRITON" python scripts/gen_ktir.py

      # Run only the ktir_cpu-marked tests (NumPy reference, no GPU). Collection
      # imports every tests/ktir/ module, so those modules must import cleanly
      # on a CPU host — see kernels/matmul/original.py:is_cuda(), which guards
      # the driver access so the import-time autotune decorator doesn't crash
      # when no GPU backend is active.
      - name: Run ktir-cpu validation tests
        run: uv run pytest tests/ktir/ -m ktir_cpu -v
